ex-direction:column;gap:.125rem}.sidebar-section-header{color:var(--shadow-claw-text-tertiary);font-size:.75rem;font-weight:700;letter-spacing:.05em;padding:.5rem .75rem .25rem;text-transform:uppercase}.sidebar-section-header a.sidebar-link{color:inherit;font-weight:700;padding:0;text-transform:uppercase}.sidebar-item{display:flex}.sidebar-link{align-items:center;border-radius:var(--shadow-claw-radius-m);color:var(--shadow-claw-text-secondary);display:flex;font-size:var(--shadow-claw-font-size-sm);font-weight:500;padding:.5rem .75rem;text-decoration:none;transition:background-color .15s,color .15s;width:100%}.sidebar-link:hover{background-color:var(--shadow-claw-text-secondary);color:var(--shadow-claw-on-primary)}.sidebar-link.active,.sidebar-link[aria-current=page]{background-color:var(--shadow-claw-accent-primary);color:var(--shadow-claw-on-primary)}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" media="print"><noscript> <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap"> </noscript>  <script id="shadow-claw-static-manifest" type="application/json">{"pages":[{"displayPath":"index.html","content":"---\ntitle: \"ShadowClaw Pages\"\ncreated: \"1970-01-01T00:00:00Z\"\nupdated: \"1970-01-01T00:00:00Z\"\nslug: \"shadow-claw-pages\"\n---\n\n\u003carticle\u003e\n  \u003ch2\u003eWelcome to ShadowClaw Pages\u003c\u002fh2\u003e\n  \u003cp\u003eThis is the default static page for your workspace.\u003c\u002fp\u003e\n  \u003ch2 id=\"getting-started-with-shadowclaw\"\u003eGetting started with ShadowClaw\u003c\u002fh2\u003e\n  \u003ch3 id=\"what-is-memorymd\"\u003eWhat is MEMORY.md?\u003c\u002fh3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\n      \"\u003ca href=\"\u002ffiles\u002fmain\u002fMEMORY.md\"\u003eMEMORY.md\u003c\u002fa\u003e\" is a per conversation, per\n      invocation, auto-loaded, persistent agent memory file.\n    \u003c\u002fli\u003e\n    \u003cli\u003e\n      It is designed to be a helpful scratchpad for agents to store important\n      information, notes, and context about the conversation.\n    \u003c\u002fli\u003e\n  \u003c\u002ful\u003e\n  \u003ch3 id=\"how-to-use-files\"\u003eHow to use Files\u003c\u002fh3\u003e\n  \u003cul\u003e\n    \u003cli\u003eOpen \"\u003ca href=\"\u002ffiles\u002fmain\"\u003eFiles\u003c\u002fa\u003e\" to browse your workspace.\u003c\u002fli\u003e\n    \u003cli\u003e\n      Edit and preview files with the file viewer:\n      \u003cul\u003e\n        \u003cli\u003e\u003ca href=\"\u002ffiles\u002fmain\u002findex.html\"\u003eindex.html\u003c\u002fa\u003e\u003c\u002fli\u003e\n      \u003c\u002ful\u003e\n    \u003c\u002fli\u003e\n  \u003c\u002ful\u003e\n  \u003ch3 id=\"how-to-use-pages\"\u003eHow to use Pages\u003c\u002fh3\u003e\n  \u003cul\u003e\n    \u003cli\u003eUse Set as Page on any markdown or HTML file to add it to Pages.\u003c\u002fli\u003e\n    \u003cli\u003eRemove a page anytime from the \"\u003ca href=\"\u002fpages\"\u003ePages\u003c\u002fa\u003e\" view.\u003c\u002fli\u003e\n  \u003c\u002ful\u003e\n  \u003ch3 id=\"how-to-use-chat\"\u003eHow to use Chat\u003c\u002fh3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\n      Open \"\u003ca href=\"\u002fsettings\"\u003eSettings\u003c\u002fa\u003e\" to configure your agent's system\n      prompt, tools, and more.\n    \u003c\u002fli\u003e\n    \u003cli\u003e\n      Open \"\u003ca href=\"\u002fchat\u002fmain\"\u003eChat\u003c\u002fa\u003e\" to start a conversation with your\n      agent.\n    \u003c\u002fli\u003e\n  \u003c\u002ful\u003e\n  \u003ch2 id=\"further-information\"\u003eFurther information\u003c\u002fh2\u003e\n  \u003cul\u003e\n    \u003cli\u003e\n      \u003ca href=\"https:\u002f\u002fgithub.com\u002fxt-ml\u002fshadow-claw#-shadowclaw\"\n        \u003eShadowClaw Project\u003c\u002fa\n      \u003e\n    \u003c\u002fli\u003e\n    \u003cli\u003e\u003ca href=\"https:\u002f\u002fdeepwiki.com\u002fxt-ml\u002fshadow-claw\"\u003eDeep Wiki\u003c\u002fa\u003e\u003c\u002fli\u003e\n  \u003c\u002ful\u003e\n\u003c\u002farticle\u003e"}],"skills":[{"displayPath":"skill-creator\u002freferences\u002fdeclarative-pipelines.md","content":"# Declarative Execution Pipelines\n\nDeclarative execution pipelines allow skills to execute deterministic sequential tool chains directly on the worker thread without scheduling a Task or making model LLM calls.\n\n## Configuration Syntax\n\nPipelines are declared in `SKILL.md` frontmatter under `metadata.execution`:\n\n```yaml\n---\nname: sample-pipeline\ndescription: Run a deterministic tool chain.\nuser-invocable: true\nmetadata:\n  allowed-tools: javascript show_toast\n  execution:\n    type: tools\n    suppressToast: true\n    suppressOutput: true\n    tools:\n      - name: javascript\n        input:\n          code: \"Math.floor(Math.random() * 100) + 1\"\n      - name: show_toast\n        input:\n          title: \"Random Number\"\n          message:\n            $pipe: prev\n---\n```\n\n## Data Piping (`$pipe`)\n\nInputs in tool step configurations can reference outputs from previous steps using the `$pipe` operator:\n\n- `{ \"$pipe\": \"prev\" }` or `{ \"$pipe\": -1 }`: Resolves to the return output of the immediately preceding tool step.\n- `{ \"$pipe\": 0 }`: Resolves to the return output of step index `0` (0-indexed).\n- `{ \"$pipe\": \"javascript\" }`: Resolves to the return output of the last step that ran the `javascript` tool.\n\n## Execution Suppression\n\n- `suppressToast: true`: Suppresses step progress toasts (\"Running skill tool...\") during pipeline execution.\n- `suppressOutput: true`: Suppresses raw tool result blocks from being rendered in the chat thread.\n- Setting suppression options at the `execution` root cascades down to all steps unless explicitly overridden per tool step.\n"},{"displayPath":"skill-creator\u002freferences\u002fdeclarative-tools.md","content":"# Declarative Tools\n\nDeclarative tools allow workspace authors to define reusable custom tools using JSON definitions placed under `.agents\u002ftools\u002f\u003cgroup\u003e\u002f\u003ctool-name\u003e.json`.\n\n## Directory Structure\n\n```text\n.agents\u002ftools\u002f\n└── main\u002f\n    └── generate_random_number.json\n```\n\n## Schema Format\n\n```json\n{\n  \"name\": \"generate_random_number\",\n  \"description\": \"Generate a random integer within a specified range.\",\n  \"executor\": \"javascript\",\n  \"inputSchema\": {\n    \"type\": \"object\",\n    \"properties\": {\n      \"min\": { \"type\": \"number\", \"default\": 1 },\n      \"max\": { \"type\": \"number\", \"default\": 1000000 }\n    }\n  },\n  \"code\": \"const min = Number(inputs.min ?? 1); const max = Number(inputs.max ?? 1000000); return Math.floor(Math.random() * (max - min + 1)) + min;\"\n}\n```\n\n## Features\n\n- **Automatic Discovery**: Automatically loaded from `.agents\u002ftools\u002f` across conversation workspaces.\n- **WebMCP Integration**: Registered with the browser ModelContext API for both manual pinning and automated agent execution.\n- **Expression Evaluation**: Code expressions automatically evaluate and return results without needing explicit wrapper boilerplate.\n"},{"displayPath":"skill-creator\u002freferences\u002ffrontmatter-spec.md","content":"# Frontmatter Specification\n\nAgent skills in ShadowClaw are configured via YAML frontmatter at the top of `SKILL.md`. Frontmatter attributes adhere strictly to the standard Agent Skills specification.\n\n## Specification Schema\n\n```yaml\n---\nname: skill-name\ndescription: \"Clear, concise model-facing trigger description.\"\nuser-invocable: true\ndisable-model-invocation: false\nargument-hint: \"[arguments]\"\nmetadata:\n  allowed-tools: read_file write_file javascript\ncompatibility: ShadowClaw\nlicense: MIT\n---\n```\n\n\u003e **Quoting Rule**: Always enclose `description` in double quotes (`\"...\"`) or use a YAML folded block scalar (`\u003e`). Descriptions often contain URLs (`https:\u002f\u002f`), colons (`trigger:` or `en:`), quotes, or parentheses that break unquoted YAML frontmatter.\n\n## Attribute Reference\n\n| Attribute                  | Type      | Required | Description                                                                                                               |\n| :------------------------- | :-------- | :------- | :------------------------------------------------------------------------------------------------------------------------ |\n| `name`                     | `string`  | **Yes**  | Skill identifier (1–64 lowercase alphanumeric characters and single hyphens).                                             |\n| `description`              | `string`  | **Yes**  | Model-facing description used for skill discovery and activation (max 1024 characters). **Always wrap in double quotes.** |\n| `user-invocable`           | `boolean` | No       | When `true` (default), allows users to invoke the skill directly via slash commands (e.g. `\u002fskill-name`).                 |\n| `disable-model-invocation` | `boolean` | No       | When `true`, hides the skill from model discovery so it is only triggered via slash command.                              |\n| `argument-hint`            | `string`  | No       | Display placeholder in the UI search\u002fautocomplete menu when typing slash commands.                                        |\n| `metadata`                 | `object`  | No       | Key-value dictionary for custom metadata, tool permissions (`allowed-tools` string or list), and `execution` pipelines.   |\n| `compatibility`            | `string`  | No       | Platform compatibility requirements or version strings.                                                                   |\n| `license`                  | `string`  | No       | Open-source software license string (e.g. `MIT`, `AGPL-3.0`).                                                             |\n\n## Metadata Attributes (`metadata`)\n\nCustom configuration properties and extension specifications (like declarative execution pipelines) that fall outside the standard Agent Skills frontmatter attributes should be placed inside `metadata`:\n\n```yaml\nmetadata:\n  allowed-tools: javascript show_toast generate_random_number\n  author: ShadowClaw Team\n  version: 1.0.0\n  execution:\n    type: tools\n    suppressToast: true\n    tools:\n      - name: javascript\n        input:\n          code: Math.floor(Math.random() * 100) + 1\n```\n"},{"displayPath":"skill-creator\u002fSKILL.md","content":"---\nname: skill-creator\ndescription: Create, edit, review, and validate ShadowClaw declarative skills and their supporting resources.\nuser-invocable: true\nmetadata:\n  allowed-tools: read_file write_file javascript create_directory\n---\n\n# ShadowClaw Skill Creator\n\nUse this skill when creating, modifying, reviewing, or validating a ShadowClaw agent skill or declarative tool pipeline.\n\n## Workspace Layout Standards\n\n- **Skills**: Create each skill in its dedicated directory under `.agents\u002fskills\u002f\u003cgroup\u003e\u002f\u003cskill-name\u003e\u002fSKILL.md` (default group: `main`).\n- **Declarative Tools**: Define supporting declarative tools under `.agents\u002ftools\u002f\u003cgroup\u003e\u002f\u003ctool-name\u003e.json` (default group: `main`).\n- **Supporting Resources**: Co-locate skill-specific assets (reference documents, templates, helper scripts) inside the skill directory alongside `SKILL.md`.\n\n## Workflow\n\n1. **Establish Contract & Scope**\n   - For existing skills, read `SKILL.md` and related resources before editing.\n   - For new skills, define the trigger prompt, intended execution outcome, required tools, and output artifacts.\n2. **Configure Frontmatter**\n   - Provide a clear, concise trigger description in `description` (1024 characters max).\n   - **Always enclose `description` in double quotes** (`description: \"...\"`) or use a YAML block scalar (`\u003e`). Colons (`:`), URLs, and trigger phrases inside unquoted YAML break parsing.\n   - Set `user-invocable: true` if the skill should be triggerable via slash command (e.g. `\u002fskill-name`).\n   - Use `disable-model-invocation: true` for skills intended strictly for slash-command execution.\n   - Place non-standard configuration (such as `allowed-tools`) within the standard `metadata` block to maintain Agent Skills specification compliance. Specify tools as a space-separated string or a list.\n3. **Structure & Draft Content**\n   - Write instructions in `SKILL.md` using clear, modular procedures.\n   - Place deterministic operations in `javascript` tool calls; use `read_file` and `write_file` for workspace persistence.\n   - Create required target directories via `create_directory` prior to writing files.\n4. **Declarative Pipelines (`execution.type: tools`)**\n   - Define sequential tool pipelines in frontmatter via `execution: { type: \"tools\", tools: [...] }`.\n   - Pass outputs between steps using `{ \"$pipe\": \"prev\" }` or step\u002ftool identifiers.\n   - Optionally apply `suppressToast: true` or `suppressOutput: true` at the execution root or per step to suppress notifications and output blocks.\n5. **Verify & Validate**\n   - Re-read the saved `SKILL.md` and verify valid YAML frontmatter syntax (ensure `description` is enclosed in double quotes).\n   - Ensure the skill name uses 1–64 lowercase alphanumeric characters or hyphens and all referenced resource paths exist.\n"}]}</script>
